# Full35-task Edge480 WAM. Prepare data with tools/robodojo/prepare_dataset.py.
# Export ROBODOJO_PREPARED_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH and
# IMAGINAIRE_OUTPUT_ROOT; optionally set ROBODOJO_TOKENIZER_PATH to a local Edge tokenizer.
# Submit from the repository root: sbatch examples/robodojo/train.sbatch
[job]
task = "vfm"
experiment = "action_policy_robodojo_all_tasks_wam"
project = "robodojo"
group = "all_tasks_wam"
name = "all35_wam_m5_480_64gpu"
wandb_mode = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = -1

[model.parallelism]
data_parallel_shard_degree = 8
data_parallel_replicate_degree = 8

[model.activation_checkpointing]
mode = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5e-5
weight_decay = 0.05
betas = [0.9, 0.99]
eps = 1e-8
lr_multipliers = {action2llm = 5.0, llm2action = 5.0, action_modality_embed = 5.0}

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [50]
f_start = [0.0]
f_max = [1.0]
f_min = [0.0]

[dataloader_train]
max_samples_per_batch = 160

[trainer]
max_iter = 2000
logging_iter = 1
grad_accum_iter = 1

[trainer.callbacks.compile_tokenizer]
enabled = false

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 50
keys_to_skip_loading = ["net_ema.", "action2llm", "llm2action"]
