# Four-task WAM matching the exp1_edge run evaluated at steps 800 and 1650.
# Tasks: classify_objects, insert_tubes, push_T, stack_bowls.
# 16 GPUs; 80 windows/GPU; accumulation 2; global batch 2560; 2000 steps.
# Control: raw absolute joint14 action and joint14 clean state; domain17.
# EEF comparison: action_policy_robodojo_four_tasks_eef_wam.toml keeps all training
# hyperparameters, image layout and domain17, with normalized relative EEF20
# action and separately normalized absolute EEF20 clean state.
# Slurm: ROBODOJO_ACTION_SPACE=joint sbatch examples/robodojo/four_tasks_wam.sbatch.
# Use the original four-task joint-action prepared data, not the all35/EEF data.
# Export ROBODOJO_PREPARED_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH and
# IMAGINAIRE_OUTPUT_ROOT. Optional ROBODOJO_TOKENIZER_PATH selects a local tokenizer.
# Launch on each of two nodes with NNODES=2, NODE_RANK=0/1 and MASTER_ADDR set:
# bash examples/launch_sft_action_policy_robodojo_four_tasks_wam.sh
[job]
task = "vfm"
experiment = "action_policy_robodojo_four_tasks_wam"
project = "robodojo"
group = "four_tasks_wam"
name = "edge_960x736_16gpu"
wandb_mode = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = -1

[model.parallelism]
data_parallel_shard_degree = 8
data_parallel_replicate_degree = 2

[model.activation_checkpointing]
mode = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5e-5
weight_decay = 0.05
betas = [0.9, 0.99]
eps = 1e-8
lr_multipliers = {action2llm = 5.0, llm2action = 5.0, action_modality_embed = 1.0}

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [50]
f_start = [0.0]
f_max = [1.0]
f_min = [0.0]

[dataloader_train]
max_samples_per_batch = 80

[trainer]
max_iter = 2000
logging_iter = 1
grad_accum_iter = 2

[trainer.callbacks.compile_tokenizer]
enabled = false

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 50
keys_to_skip_loading = ["net_ema.", "action2llm", "llm2action"]
