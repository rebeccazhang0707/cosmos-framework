<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEF4 EEF · RoboDojo SR</title>
<style>body{font:16px/1.65 system-ui;max-width:1250px;margin:25px auto;padding:20px;color:#20334a;background:#f6f8fb}section{background:white;padding:20px;border-radius:10px;margin:20px 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #ddd;padding:9px}a{color:#2166ac}.cameras{background:#101722;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.head{grid-column:1/3;width:50%;justify-self:center}figure{margin:0;min-width:0}figcaption{color:#ddd;font-size:13px}video{width:100%;display:block;background:black}select{font:inherit;padding:7px;margin:5px}#message{background:#e9f0fc;padding:10px}.links{display:flex;gap:18px;flex-wrap:wrap}@media(max-width:650px){body{padding:10px}.head{width:75%}th,td{padding:5px;font-size:13px}}</style>
<div class="links"><a href="../">训练与 held-out 曲线</a><a href="report.json">完整结果 JSON</a><a href="success_rates.csv">SR CSV</a></div>
<h1 id="title">EEF4 · 四任务闭环成功率</h1><p>EMA；30步去噪；16步动作块；25 Hz；每个客户端单环境。每任务15回合，共60回合；seed 0/1/2，每seed各5回合。叠碗与推T各包含标准、随机场景。</p>
<p id="message">正在读取评测状态……</p><p id="jobs"></p><section><table><thead><tr><th>任务</th><th>已完成 / 目标</th><th>成功</th><th>SR</th><th>过程得分</th><th>保留视频回合</th></tr></thead><tbody id="metrics"></tbody></table><p id="updated"></p></section>
<section><h2>每任务5条原始视频回合</h2><p>每回合保留高位、左腕、右腕三路 640×480 原视频。回合在评测前固定，跨 seed / 场景选取；网页仅同步播放和调整显示布局。</p><select id="task"></select><select id="episode"></select><p id="info"></p>
<div class="cameras"><figure class="head"><figcaption>高位相机</figcaption><video id="head" controls playsinline preload="metadata"></video></figure><figure><figcaption>左腕相机</figcaption><video id="left" muted playsinline preload="metadata"></video></figure><figure><figcaption>右腕相机</figcaption><video id="right" muted playsinline preload="metadata"></video></figure></div>
<p class="links" id="downloads"></p><p>高位视频的播放、暂停、拖动和倍速会同步到两路腕部视频。</p></section>
<script>
const $=id=>document.getElementById(id), head=$('head'), wrists=[$('left'),$('right')];let report,signature;
const names={classify_objects:'物体分类',stack_bowls:'叠碗',push_T:'推T',insert_tubes:'插管'};
function options(el,values,label){const keep=el.value;el.replaceChildren(...values.map(value=>{const o=document.createElement('option');o.value=value;o.textContent=label(value);return o}));if(values.map(String).includes(keep))el.value=keep;}
const clipKey=c=>`${c.task}:${c.seed}:${c.episode}`;
function episodeChanged(){const row=report.families[$('task').value],clip=row.videos.find(c=>clipKey(c)===$('episode').value);if(!clip){head.pause();for(const v of [head,...wrists]){v.removeAttribute('src');v.load()}$('info').textContent='该任务的已选回合视频尚未生成。';return}head.pause();for(const [id,camera] of [['head','cam_head'],['left','cam_left_wrist'],['right','cam_right_wrist']]){$(id).src=clip.cameras[camera];$(id).load()};$('info').textContent=`${clip.task} · seed ${clip.seed} · episode ${clip.episode} · ${clip.outcome==='success'?'成功':'失败'}`;$('downloads').replaceChildren(...[['高位','cam_head'],['左腕','cam_left_wrist'],['右腕','cam_right_wrist']].map(([label,camera])=>{const a=document.createElement('a');a.href=clip.cameras[camera];a.target='_blank';a.textContent='打开 / 下载'+label;return a}));}
function refreshEpisodes(load){const heading=`EEF4 · checkpoint${report.manifest.step} · 四任务闭环成功率`;$('title').textContent=heading;document.title=heading;const clips=report.families[$('task').value].videos;options($('episode'),clips.map(clipKey),key=>{const c=clips.find(c=>clipKey(c)===key);return `${c.task} · seed${c.seed} · 回合${c.episode} · ${c.outcome==='success'?'成功':'失败'}`});if(load)episodeChanged()}
function taskChanged(){refreshEpisodes(true)}
$('task').onchange=taskChanged;$('episode').onchange=episodeChanged;
head.addEventListener('play',()=>{for(const v of wrists){v.currentTime=head.currentTime;v.play().catch(()=>{})}});head.addEventListener('pause',()=>wrists.forEach(v=>v.pause()));head.addEventListener('seeking',()=>wrists.forEach(v=>v.currentTime=head.currentTime));head.addEventListener('ratechange',()=>wrists.forEach(v=>v.playbackRate=head.playbackRate));head.addEventListener('timeupdate',()=>{for(const v of wrists)if(Number.isFinite(v.duration)&&Math.abs(v.currentTime-head.currentTime)>.12)v.currentTime=Math.min(head.currentTime,v.duration)});
async function refresh(){try{const response=await fetch('report.json',{cache:'no-store'});if(!response.ok)throw Error(response.status);const next=await response.json();if(signature===next.updated_at)return;signature=next.updated_at;report=next;$('message').textContent=next.complete?`${next.target}回合已完成，以下为当前协议 SR。`:`评测尚未完成：${next.episodes}/${next.target} 回合；当前 SR 为部分结果。`;$('jobs').textContent=(next.job_states||[]).map(j=>`Job ${j.job_id}: ${j.state} (${j.elapsed})`).join(' · ');$('updated').textContent='更新：'+new Date(next.updated_at).toLocaleString()+'；每30秒刷新。';$('metrics').replaceChildren(...Object.entries(next.families).map(([task,row])=>{const tr=document.createElement('tr');for(const text of [names[task]||task,`${row.episodes}/${row.target}`,row.successes,row.success_rate===null?'—':(100*row.success_rate).toFixed(2)+'%',row.score===null?'—':row.score.toFixed(2),`${row.videos.length}/5`]){const td=document.createElement('td');td.textContent=text;tr.append(td)}return tr}));const first=!$('task').options.length;options($('task'),Object.keys(next.families),t=>names[t]||t);if(first)taskChanged();else refreshEpisodes(head.paused&&!head.currentSrc);}catch(e){$('message').textContent='暂时无法更新：'+e.message}}refresh();setInterval(refresh,30000);
</script></html>
